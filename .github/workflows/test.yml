name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current month
        run: echo "CURRENT_MONTH=$(date +'%m')" >> $GITHUB_ENV

      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v5
        with:
          path: ~/.sbt
          key: ${{ runner.os }}-sbt-${{ env.CURRENT_MONTH }}-${{ hashFiles('project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-${{ env.CURRENT_MONTH }}-

      - name: Cache coursier cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier
          key: ${{ runner.os }}-coursier-${{ env.CURRENT_MONTH }}-${{ hashFiles('project/*') }}-${{ hashFiles('*.sbt') }}
          restore-keys: | 
            ${{ runner.os }}-coursier-${{ env.CURRENT_MONTH }}-${{ hashFiles('project/*') }}
            ${{ runner.os }}-coursier-${{ env.CURRENT_MONTH }}-

      - name: Cache project
        uses: actions/cache@v5
        with:
          path: ./
          key: ${{ runner.os }}-project-${{ github.run_number }}
          restore-keys: ${{ runner.os }}-project-

      - name: Checkout current
        run: git checkout . && git clean -df

      - name: Run tests
        run: sbt --server cachedCiTest

      - name: Clean caches
        run: |
          find ~/.sbt        -name "*.lock"               -print -delete
          rm -rf ./.git
          rm -rf ./project/target #clean doesn't clean meta-build

